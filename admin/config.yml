backend:
  name: git-gateway
  repo: NJV121/school-repo
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/fb92381f-7932-483f-ad76-ec94df12b6eb/pkce
  auth_token_endpoint: /sites/fb92381f-7932-483f-ad76-ec94df12b6eb/token
  gateway_url: https://gateway.decapbridge.com

commit_messages:
  create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://njvpublicschool.netlify.app

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site"
    label: "Website Content"
    files:
      - name: "content"
        label: "Homepage Content"
        file: "content/site-data.json"
        fields:
          - label: "Homepage Background Photo"
            name: "hero_photo"
            widget: "image"
            required: false
            hint: "Shown behind the headline at the top of the homepage. Leave empty to keep the default design."

          - label: "Events Gallery"
            name: "events"
            widget: "list"
            required: false
            summary: "{{fields.caption}}"
            fields:
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string", required: false }

          - label: "Toppers"
            name: "toppers"
            widget: "list"
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Class", name: "class", widget: "string", required: false }
              - { label: "Details (marks / percentage)", name: "detail", widget: "string", required: false }
